<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News &amp; Bulletins — Municipality of Calatrava, Romblon</title>
<meta name="description" content="Latest news, announcements, ordinances, and public bulletins from the Municipality of Calatrava, Romblon.">
<link rel="icon" type="image/png" href="assets/logos/Calatrava_Romblon_web.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-hero">
  <div class="page-hero-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>News</span></nav>
    <h1>News &amp; <em>bulletins</em></h1>
    <p>Announcements, ordinances, biddings, and events from the Municipality of Calatrava.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:920px">
    <div class="news-list" id="newsList"><!-- rendered from data/news.json --></div>
  </div>
</section>

<script src="assets/app.js"></script>
<script>
const FALLBACK = { items: [] };

const EMPTY_STATE = `<div class="empty-state">
  <h2>No bulletins published yet</h2>
  <p>Announcements, ordinances, biddings, and events will appear here as the
     Municipal Information Office publishes them. In the meantime you can follow
     the municipality on
     <a href="https://www.facebook.com/calatrava.romblon.217551/" target="_blank" rel="noopener">Facebook<span class="sr-only"> (opens in a new tab)</span></a>,
     or <a href="contact.html">contact the Municipal Hall</a> directly.</p>
</div>`;

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function renderNews(items){
  if (!items.length) { document.getElementById('newsList').innerHTML = EMPTY_STATE; return; }
  document.getElementById('newsList').innerHTML = items.map(it => {
    const d = new Date(it.date);
    const valid = !isNaN(d);
    const day = valid ? d.getDate() : '';
    const mo = valid ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : it.date;
    const alt = it.imageAlt ? it.imageAlt.replace(/"/g, '&quot;') : '';
    const media = it.image ? `<div class="card-media" style="border-radius:4px;margin-bottom:1rem;max-width:420px"><img src="${it.image}" alt="${alt}" onerror="this.parentElement.remove()"></div>` : '';
    const fbLink = it.source === 'facebook' && it.link
      ? `<a class="news-fb-link" href="${it.link}" target="_blank" rel="noopener">View this post on Facebook<span class="sr-only"> (opens in a new tab)</span> &rarr;</a>`
      : '';
    return `<article class="news-row reveal">
      <div class="news-date"><div class="day">${day}</div><div class="mo">${mo}</div></div>
      <div>
        <div class="card-tag">${it.tag || 'News'}</div>
        <h3>${it.title}</h3>
        ${media}
        <p>${it.summary || ''}</p>
        ${fbLink}
      </div>
    </article>`;
  }).join('');
}

(async function(){
  initChrome('news');
  // Two sources: data/news.json is written by staff, data/news-fb.json is
  // generated by the Facebook sync workflow. Keeping them apart means the
  // bot never touches hand-written bulletins, and staff news still renders
  // if the sync ever breaks.
  const [staff, fb] = await Promise.all([
    loadJSON('data/news.json', FALLBACK),
    loadJSON('data/news-fb.json', { items: [] })
  ]);
  const items = [...(staff.items || []), ...(fb.items || [])]
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  renderNews(items);
  observeReveal();
})();
</script>
</body>
</html>
