<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Municipality of Calatrava, Romblon</title>
<meta name="description" content="Contact the Municipality of Calatrava: office directory, address, hours, and how to reach each office.">
<link rel="icon" type="image/png" href="assets/logos/Calatrava_Romblon_web.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-hero">
  <div class="page-hero-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Contact</span></nav>
    <h1>Get in <em>touch</em></h1>
    <p id="addressLine"></p>
  </div>
</section>

<!-- DIRECTORY -->
<section class="section">
  <div class="container">
    <div class="section-head"><span class="s-label">Office directory</span><h2 class="s-title">Reach the right <em>office</em></h2></div>
    <div class="dir-grid" id="directory"><!-- rendered from data/contact.json --></div>
  </div>
</section>

<!-- FIND US moved to about-us.html#find-us; the directory is what this page is for. -->
<section class="section sand tight">
  <div class="container">
    <p class="mandate-note" style="margin-top:0"><a href="about-us.html#find-us">Find the Municipal Hall on the map &rarr;</a></p>
  </div>
</section>

<script src="assets/app.js"></script>
<script>
// Shown only if data/contact.json fails to load. Carries real values only —
// an invented number or address here would be published just as readily as
// one in the JSON.
const FALLBACK = {
  address: "Municipal Hall, Poblacion, Calatrava, Romblon, Philippines",
  hours: "Monday–Friday, 8:00 AM – 5:00 PM",
  email: "andagaoutour@gmail.com",
  phone: "0966 439 3711",
  mapEmbed: "https://www.google.com/maps?q=Calatrava,Romblon&output=embed",
  directory: [{ office: "Office of the Municipal Mayor", head: "Engr. Robert M. Fabella", phone: "0966 439 3711", email: "andagaoutour@gmail.com" }]
};

function renderDirectory(d){
  const tel = n => (n || '').replace(/[^0-9+]/g,'');
  const link = (href, text) => text ? `<a href="${href}">${text}</a>` : '—';
  document.getElementById('directory').innerHTML = (d.directory || []).map(o =>
    `<div class="dir-card reveal">
      <h3>${o.office}</h3>
      <div class="dir-line"><span>Head</span> ${o.head || 'TBA'}</div>
      <div class="dir-line"><span>Phone</span> ${link('tel:' + tel(o.phone), o.phone)}</div>
      <div class="dir-line"><span>Email</span> ${link('mailto:' + o.email, o.email)}</div>
    </div>`).join('');
}

(async function(){
  initChrome('contact');
  const d = await loadJSON('data/contact.json', FALLBACK);
  document.getElementById('addressLine').innerHTML =
    `${d.address || ''}<br>${d.hours || ''} &middot; <a href="tel:${(d.phone||'').replace(/[^0-9+]/g,'')}" style="color:var(--gl)">${d.phone || ''}</a> &middot; <a href="mailto:${d.email}" style="color:var(--gl)">${d.email || ''}</a>`;
  renderDirectory(d);
  observeReveal();
})();
</script>
</body>
</html>
