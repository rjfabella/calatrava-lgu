<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — Municipality of Calatrava, Romblon</title>
<meta name="description" content="The history of Calatrava, Romblon, its seven barangays and their Punong Barangays, and where to find the Municipality on the map.">
<link rel="icon" type="image/png" href="assets/logos/Calatrava_Romblon_web.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-hero">
  <div class="page-hero-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>About Us</span></nav>
    <h1>About <em>Calatrava</em></h1>
    <p>Where the town came from, the seven barangays that make it up, and where to find us.</p>
  </div>
</section>

<!-- TABS -->
<section class="section tight">
  <div class="container">
    <div class="tabs" role="tablist" aria-label="About Calatrava">
      <button class="tab" role="tab" id="tab-history"   aria-controls="panel-history"   aria-selected="true"  >History</button>
      <button class="tab" role="tab" id="tab-barangays" aria-controls="panel-barangays" aria-selected="false" tabindex="-1">Barangays</button>
      <button class="tab" role="tab" id="tab-map"       aria-controls="panel-map"       aria-selected="false" tabindex="-1">Map</button>
    </div>
  </div>
</section>

<!-- HISTORY -->
<div class="tab-panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" tabindex="0">
  <section class="section tight" id="history">
    <div class="container">
      <div class="section-head"><span class="s-label">Our story</span><h2 class="s-title">History of <em>Calatrava</em></h2></div>
      <div class="prose" id="historyProse"></div>
      <p class="mandate-note" id="historySource"></p>
    </div>
  </section>
</div>

<!-- BARANGAYS -->
<div class="tab-panel" id="panel-barangays" role="tabpanel" aria-labelledby="tab-barangays" tabindex="0" hidden>
  <section class="section tight" id="barangays">
    <div class="container">
      <div class="section-head">
        <span class="s-label">Seven barangays</span>
        <h2 class="s-title">Our <em>Barangays</em></h2>
        <p class="charter-intro" id="brgyIntro"></p>
      </div>
      <div class="brgy-wrap"><table class="brgy-table" id="barangayTable"><!-- rendered from data/barangays.json --></table></div>
    </div>
  </section>
</div>

<!-- MAP -->
<div class="tab-panel" id="panel-map" role="tabpanel" aria-labelledby="tab-map" tabindex="0" hidden>
  <section class="section tight" id="map-section">
    <div class="container">
      <div class="section-head"><span class="s-label">Find us</span><h2 class="s-title">Municipality of <em>Calatrava</em></h2></div>
      <p class="charter-intro" id="hallAddress"></p>
      <div class="map-wrap"><iframe id="map" title="Map of the Municipality of Calatrava, centred on the Municipal Hall" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src=""></iframe></div>
      <p class="mandate-note"><a href="contact.html">Looking for a particular office? See the full contact directory &rarr;</a></p>
    </div>
  </section>
</div>

<script src="assets/app.js"></script>
<script>
const FALLBACK_OFFICIALS = { history: [], historySource: "" };
const FALLBACK_BARANGAYS = { intro: "", barangays: [] };
const FALLBACK_CONTACT = {
  address: "Municipal Hall, Poblacion, Calatrava, Romblon, Philippines",
  hours: "Monday–Friday, 8:00 AM – 5:00 PM",
  mapEmbed: "https://www.google.com/maps?q=Calatrava+Municipal+Hall,+Calatrava,+Romblon&ll=12.6182304,122.0707587&z=17&output=embed"
};

const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderBarangays(d){
  const rows = (d.barangays || []).map(b => {
    const seal = b.seal
      ? `<img class="brgy-seal" src="${esc(b.seal)}" alt="Official seal of Barangay ${esc(b.name)}" width="56" height="56" loading="lazy">`
      : `<span class="brgy-seal brgy-seal-empty" aria-hidden="true">${esc(b.name.charAt(0))}</span>`;
    const tel = b.phone ? `<a href="tel:+63${b.phone.replace(/\D/g,'').replace(/^0/,'')}">${esc(b.phone)}</a>` : '';
    const mail = b.email ? `<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : '';
    const contact = [tel, mail].filter(Boolean).join('<br>') || '<span class="brgy-muted">—</span>';
    return `<tr>
      <th scope="row"><span class="brgy-id">${seal}<span class="brgy-nm">${esc(b.name)}</span></span></th>
      <td data-label="Punong Barangay"><span class="brgy-val">${b.captain ? esc(b.captain) : '<em class="brgy-muted">To be announced</em>'}</span></td>
      <td data-label="Contact" class="brgy-contact"><span class="brgy-val">${contact}</span></td>
      <td data-label="Population (2020 PSA)" class="brgy-pop"><span class="brgy-val">${esc(b.population || '—')}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('barangayTable').innerHTML = `
    <caption class="sr-only">The 7 barangays of Calatrava with their Punong Barangay, contact details and 2020 population</caption>
    <thead><tr><th scope="col">Barangay</th><th scope="col">Punong Barangay</th><th scope="col">Contact</th><th scope="col" class="brgy-pop">Population <span>(2020 PSA)</span></th></tr></thead>
    <tbody>${rows}</tbody>`;
}

(async function(){
  initChrome('about-us');

  const tabs = setupTabs(['history', 'barangays', 'map']);

  const o = await loadJSON('data/officials.json', FALLBACK_OFFICIALS);
  document.getElementById('historyProse').innerHTML = (o.history || []).map(p => `<p>${p}</p>`).join('');
  const src = document.getElementById('historySource');
  if (o.historySource) src.textContent = o.historySource; else src.remove();

  const b = await loadJSON('data/barangays.json', FALLBACK_BARANGAYS);
  document.getElementById('brgyIntro').textContent = b.intro || '';
  renderBarangays(b);

  const c = await loadJSON('data/contact.json', FALLBACK_CONTACT);
  document.getElementById('hallAddress').textContent = [c.address, c.hours].filter(Boolean).join(' · ');
  if (c.mapEmbed) document.getElementById('map').src = c.mapEmbed;

  observeReveal();
  applyTabHash(tabs, true);
  window.addEventListener('hashchange', () => applyTabHash(tabs, true));
})();
</script>
</body>
</html>
