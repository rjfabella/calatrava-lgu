<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barangays — Municipality of Calatrava, Romblon</title>
<meta name="description" content="The 7 barangays of the Municipality of Calatrava, Romblon, with their barangay officials and population.">
<link rel="icon" type="image/png" href="assets/logos/Calatrava_Romblon_web.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="page-hero">
  <div class="page-hero-inner">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Barangays</span></nav>
    <h1>Our <em>Barangays</em></h1>
    <p id="intro"></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="brgy-grid" id="barangays"><!-- rendered from data/barangays.json --></div>
  </div>
</section>

<script src="assets/app.js"></script>
<script>
const FALLBACK = {
  intro: "The Municipality of Calatrava is composed of 7 barangays on the northern tip of Tablas Island.",
  barangays: [{ name: "Poblacion", seal: "assets/images/barangays/poblacion.png", captain: "", phone: "", email: "", population: "1,764" }]
};

(async function(){
  initChrome('barangays');
  const d = await loadJSON('data/barangays.json', FALLBACK);
  document.getElementById('intro').textContent = d.intro || '';
  document.getElementById('barangays').innerHTML = (d.barangays || []).map(b => {
    const seal = b.seal
      ? `<img class="brgy-seal" src="${b.seal}" alt="Official seal of Barangay ${b.name}" width="96" height="96" loading="lazy">`
      : `<div class="brgy-seal brgy-seal-empty" aria-hidden="true">${b.name.charAt(0)}</div>`;
    const tel = b.phone ? `<a href="tel:+63${b.phone.replace(/\D/g,'').replace(/^0/,'')}">${b.phone}</a>` : '';
    const mail = b.email ? `<a href="mailto:${b.email}">${b.email}</a>` : '';
    const contact = [tel, mail].filter(Boolean).join('');
    return `<div class="brgy-item">
      ${seal}
      <div class="brgy-body">
        <h3>${b.name}</h3>
        <div class="brgy-cap">Punong Barangay: ${b.captain ? `<b>${b.captain}</b>` : '<em>To be announced</em>'}</div>
        ${contact ? `<div class="brgy-contact">${contact}</div>` : ''}
        <div class="brgy-meta">Population: <b>${b.population || '—'}</b></div>
      </div>
    </div>`;
  }).join('');
  observeReveal();
})();
</script>
</body>
</html>
